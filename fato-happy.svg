<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none">
<style>
  .blink{transform-box:fill-box; transform-origin:center; animation:blink 5s infinite;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.1);}}
  
  .wave{transform-box:view-box; transform-origin:206px 232px; animation:wave 1.4s ease-in-out infinite;}
  @keyframes wave{0%,100%{transform:rotate(0);} 50%{transform:rotate(-14deg);}}
  .spark path{transform-box:fill-box; transform-origin:center; animation:twinkle 1.8s ease-in-out infinite;}
  .spark .s2{animation-delay:.6s;}
  @keyframes twinkle{0%,100%{transform:scale(.5); opacity:.4;} 50%{transform:scale(1.1); opacity:1;}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>

<!-- corpo: camisa polo vermelha, base arredondada (adesivo), não um recorte seco -->

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planilha · Crediffato</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<!--
  Planilhas do Crediffato Gestão: abre numa guia própria do navegador (a partir da aba Planilhas do board).
  Os dados ficam no Firestore do board (mesmo login): boards/planilhas (índice e permissões),
  boards/planilha-<id> (guias, colunas e células) e boards/planilha-<id>-pres (quem está aqui e onde).
  Cada célula é gravada sozinha (campo dados.<guia>.<linha>.<coluna>): duas pessoas mexendo em células
  diferentes ao mesmo tempo nunca apagam o trabalho uma da outra. Este arquivo não guarda dado nenhum.
-->
<style>
:root{
  --bg:#09090b; --s1:#131315; --s2:#1c1c1f; --s3:#27272b; --hair:#2c2c31; --hair2:#222226;
  --t1:#f5f5f7; --t2:#a5a5ad; --t3:#7f7f88; --red:#d40f3a; --red-hi:#ff4d6d; --red-dim:rgba(212,15,58,.15);
  --ok:#4ee2a0; --warn:#d8a94a; --crit:#e2564f; --info:#8b8dfb; --teal:#37b8a6;
  --f-ui:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sel:#ff4d6d; color-scheme:dark;
}
:root[data-theme="claro"]{ --bg:#f4f4f6; --s1:#ffffff; --s2:#f0f0f2; --s3:#e4e4e8; --hair:#dcdce0; --hair2:#e8e8ec; --t1:#18181b; --t2:#55555c; --t3:#83838a; --red-dim:rgba(212,15,58,.08); color-scheme:light; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f-ui);font-size:13.5px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.hidden{display:none!important}

/* topo */
.topo{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--hair);flex-wrap:wrap;position:relative}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--red),var(--red-hi) 25%,transparent 70%)}
.marca{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--t1)}
.marca img{width:22px;height:22px;object-fit:contain}
.marca i{font-style:normal;color:var(--red-hi)}
.tit{display:grid;min-width:0}
.tit small{color:var(--t3);font-size:11.5px}
.tit input{all:unset;font-weight:600;font-size:16px;min-width:120px;max-width:44vw;border-radius:6px;padding:1px 4px;margin-left:-4px}
.tit input:hover:not([readonly]){background:var(--s2)}.tit input:focus{background:var(--s2);box-shadow:0 0 0 1px var(--hair)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ok);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulso 2s infinite}
.live.salvando{color:var(--warn)}.live.salvando i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.live.off{color:var(--crit)}.live.off i{background:var(--crit);box-shadow:none;animation:none}
.ler{font-family:var(--f-num);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--hair);color:var(--t2)}
.pres{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px}
.avs{display:inline-flex}.avs b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid var(--s1);margin-left:-7px;color:#0b0b0d;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;cursor:default}
.avs b:first-child{margin-left:0}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;border:1px solid var(--hair);background:var(--s1);font-size:12.5px;color:var(--t1);white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--t3)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:14px;height:14px}

/* barra de visões e ferramentas */
.barra{display:flex;align-items:center;gap:10px;padding:8px 16px 0;background:var(--bg);flex-wrap:wrap}
.vts{display:flex;gap:2px;border-bottom:1px solid var(--hair)}
.vt{all:unset;cursor:pointer;padding:8px 13px;font-size:13px;color:var(--t2);border-bottom:2px solid transparent;transition:color .15s}
.vt:hover{color:var(--t1)}.vt.on{color:var(--t1);border-bottom-color:var(--red)}
.ferr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto;padding-bottom:6px}
.busca{padding:6px 10px;border-radius:9px;border:1px solid var(--hair);background:var(--s1);color:var(--t1);font:inherit;font-size:12.5px;width:180px}
.fx{display:flex;align-items:center;gap:8px;margin:8px 16px 0;padding:0 10px;border:1px solid var(--hair);border-radius:10px;background:var(--s1);height:34px}
.fx .end{font-family:var(--f-num);font-size:12px;color:var(--t2);min-width:52px;border-right:1px solid var(--hair);padding-right:8px}
.fx b{font-family:var(--f-num);color:var(--red-hi);font-style:italic;font-size:12px}
.fx input{all:unset;flex:1;font-family:var(--f-num);font-size:12.5px;min-width:0}
.fx .dica{color:var(--t3);font-size:11.5px;white-space:nowrap}

/* área */
.area{flex:1;min-height:0;position:relative;margin:8px 16px 0;border:1px solid var(--hair);border-radius:12px 12px 0 0;background:var(--s1);overflow:hidden;display:flex;flex-direction:column}
.vis{flex:1;min-height:0;overflow:auto;position:relative}
.vis.entra{animation:entra .32s cubic-bezier(.2,.8,.2,1)}

/* grade */
table.g{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.g th,.g td{border-right:1px solid var(--hair2);border-bottom:1px solid var(--hair2);padding:0 9px;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.g thead th{position:sticky;top:0;background:var(--s2);z-index:3;font-weight:600;color:var(--t2);font-size:12px;cursor:pointer;user-select:none}
.g thead th:hover{color:var(--t1)}
.g thead th .l{font-family:var(--f-num);font-weight:500;color:var(--t3);margin-right:6px}
.g thead th .ti{float:right;font-family:var(--f-num);font-weight:400;color:var(--t3);font-size:10.5px}
.g .rn{width:46px;text-align:center;color:var(--t3);font-family:var(--f-num);font-size:11px;background:var(--s2);position:sticky;left:0;z-index:2;cursor:pointer;padding:0}
.g thead .rn{z-index:4;cursor:default}
.g td.c0{position:sticky;left:46px;background:var(--s1);z-index:1}
.g thead th.c0{left:46px;z-index:4}
.g td{cursor:cell}
.g td.num{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.g td.err{color:var(--crit);font-family:var(--f-num)}
.g td.fm{background-image:linear-gradient(135deg,transparent 88%,var(--teal) 88%);background-size:8px 8px;background-repeat:no-repeat;background-position:top right}
.g td.ins{background:var(--red-dim)!important}
.g td.cur{box-shadow:inset 0 0 0 2px var(--sel);background:rgba(212,15,58,.06)}
.g td.outro{box-shadow:inset 0 0 0 2px var(--cor)}
.g td.brilha{animation:brilho 1.6s ease-out}
.g tr:hover td:not(.rn):not(.ins){background-color:rgba(255,255,255,.025)}
.g tr.nova td{animation:linha .35s ease both}
.g .addl td{color:var(--t3);cursor:pointer;height:34px}
.g .addl td:hover{color:var(--t1)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pes{display:inline-flex;align-items:center;gap:6px}.pes b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#0b0b0d;flex:none}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--t3);display:inline-grid;place-items:center;vertical-align:middle;transition:background .15s,border-color .15s}
.chk.on{background:var(--ok);border-color:var(--ok)}.chk.on::after{content:"";width:8px;height:4px;border-left:2px solid #0b0b0d;border-bottom:2px solid #0b0b0d;transform:rotate(-45deg) translate(1px,-1px)}
.late{color:var(--crit);font-weight:600}
a.lk{color:#7fb3ff;text-decoration:none}a.lk:hover{text-decoration:underline}
.editor{position:absolute;z-index:9;border:2px solid var(--sel);background:var(--s1);color:var(--t1);font:inherit;font-size:13px;padding:0 8px;outline:none;box-shadow:0 10px 30px -10px #000}
select.editor{padding:0 4px}

/* guias */
.guias{display:flex;align-items:center;gap:2px;padding:4px 8px;margin:0 16px 10px;border:1px solid var(--hair);border-top:0;border-radius:0 0 12px 12px;background:var(--s2);overflow-x:auto}
.gu{all:unset;cursor:pointer;padding:6px 14px;border-radius:7px;font-size:12.5px;color:var(--t2);white-space:nowrap;transition:background .15s,color .15s}
.gu:hover{color:var(--t1)}.gu.on{background:var(--s1);color:var(--t1);box-shadow:inset 0 2px 0 var(--red)}
.gu input{all:unset;width:110px}
.guias .soma{margin-left:auto;font-family:var(--f-num);font-size:11.5px;color:var(--t3);padding:0 8px;white-space:nowrap}

/* quadro e calendário */
.kan{display:flex;gap:12px;padding:14px;align-items:flex-start;min-height:100%}
.col{width:270px;flex:none;background:var(--s2);border:1px solid var(--hair2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.col.sobre{border-color:var(--red);background:var(--red-dim)}
.col h5{margin:0;font-size:12.5px;display:flex;align-items:center;gap:8px}
.col h5 em{font-style:normal;margin-left:auto;font-family:var(--f-num);color:var(--t3)}
.kc{background:var(--s1);border:1px solid var(--hair2);border-radius:10px;padding:10px 11px;display:grid;gap:7px;font-size:12.5px;cursor:grab;transition:transform .2s,box-shadow .2s;animation:sobe .3s ease both}
.kc:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px #000}
.kc.arrasta{opacity:.4}
.kc b{font-weight:600}.kc small{color:var(--t3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cal{padding:14px;display:grid;gap:10px}
.calhead{display:flex;align-items:center;gap:10px}
.calhead b{font-size:15px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calg .dn{color:var(--t3);font-size:11.5px;text-align:center}
.dia{min-height:92px;background:var(--s2);border:1px solid var(--hair2);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;min-width:0}
.dia.fora{opacity:.35}.dia.hoje{border-color:var(--red)}
.dia .n{font-family:var(--f-num);color:var(--t3)}
.dia .ev{padding:2px 6px;border-radius:6px;background:var(--s3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--c,var(--t3))}
.res{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start}
.rc{background:var(--s2);border:1px solid var(--hair2);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start;animation:sobe .35s ease both}
.rc h4{margin:0;font-size:13px;color:var(--t2);font-weight:600}
.rc .big{font-family:var(--f-num);font-size:30px;font-weight:500}
.barr{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.barr i{height:8px;border-radius:99px;background:var(--s3);overflow:hidden;display:block}
.barr i span{display:block;height:100%;border-radius:99px;transform-origin:left;animation:cresce .7s cubic-bezier(.2,.8,.2,1) both}
.barr em{font-style:normal;font-family:var(--f-num);text-align:right;color:var(--t2)}
.vazio{padding:40px;text-align:center;color:var(--t3);display:grid;gap:10px;justify-items:center}

/* cursores ao vivo */
.cursores{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.curs{position:absolute;left:0;top:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s;will-change:transform}
.curs svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.curs span{position:absolute;left:14px;top:16px;padding:2px 8px;border-radius:7px 7px 7px 2px;font-size:11px;font-weight:600;color:#0b0b0d;white-space:nowrap}

/* menus e janelas */
.menu{position:fixed;z-index:30;background:var(--s1);border:1px solid var(--hair);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 20px 50px -20px #000;animation:sobe .18s ease both;display:grid;gap:2px}
.menu button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--s2)}.menu hr{border:0;border-top:1px solid var(--hair);margin:4px 0}
.menu .perigo{color:var(--crit)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:40;padding:16px;animation:aparece .2s ease both}
.janela{width:min(460px,100%);background:var(--s1);border:1px solid var(--hair);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 30px 80px -30px #000;animation:sobe .25s cubic-bezier(.2,.8,.2,1) both;max-height:90vh;overflow:auto}
.janela h3{margin:0;font-size:16px}
.campo{display:grid;gap:5px;font-size:12.5px;color:var(--t2)}
.campo input,.campo select{padding:8px 10px;border-radius:9px;border:1px solid var(--hair);background:var(--s2);color:var(--t1);font:inherit;font-size:13px}
.ops{display:grid;gap:6px}
.op{display:flex;gap:8px;align-items:center}
.op input[type=text]{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--hair);background:var(--s2);color:var(--t1);font:inherit;font-size:12.5px}
.op input[type=color]{width:32px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;right:18px;bottom:18px;background:var(--s2);border:1px solid var(--hair);border-radius:10px;padding:9px 13px;font-size:12.5px;z-index:50;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:360px}
.toast.on{opacity:1;transform:none}
.aviso{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60;padding:20px}
.aviso div{max-width:420px;text-align:center;display:grid;gap:12px;justify-items:center}
.aviso h1{margin:0;font-size:20px}.aviso p{margin:0;color:var(--t2)}
.carrega{width:34px;height:34px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--red);animation:gira .8s linear infinite}
.ajuda{color:var(--t3);font-size:12px;line-height:1.5}
.ajuda code{font-family:var(--f-num);color:var(--t2)}

@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(78,226,160,.45)}60%{box-shadow:0 0 0 6px rgba(78,226,160,0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sobe{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes brilho{0%{background-color:rgba(142,230,199,.3)}100%{background-color:transparent}}
@keyframes linha{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){.barra,.fx{margin-left:8px;margin-right:8px}.area,.guias{margin-left:8px;margin-right:8px}.busca{width:120px}.pres span.t{display:none}}
</style>
<script>try{ var t = localStorage.getItem('theme'); if(t === 'claro') document.documentElement.setAttribute('data-theme', 'claro'); }catch(e){}</script>
</head>
<body>
<header class="topo">
  <a class="marca" href="index.html" title="Voltar ao Crediffato Gestão"><img src="logo.png" alt="">Crediffato <i>Planilhas</i></a>
  <div class="tit"><small id="pasta">…</small><input id="nome" aria-label="Nome da planilha" readonly value="Carregando…"></div>
  <span class="live" id="live"><i></i><span>Conectando…</span></span>
  <span class="ler hidden" id="soLer">somente leitura</span>
  <div class="pres"><span class="avs" id="avs"></span><span class="t" id="presTxt"></span></div>
</header>
<div class="barra">
  <div class="vts" role="tablist"><button class="vt on" data-v="grade">Grade</button><button class="vt" data-v="quadro">Quadro</button><button class="vt" data-v="cal">Calendário</button><button class="vt" data-v="resumo">Resumo</button></div>
  <div class="ferr">
    <input class="busca" id="busca" type="search" placeholder="Buscar nesta guia…" aria-label="Buscar nesta guia">
    <button class="btn so-edita" id="bLinha" title="Nova linha no fim">+ Linha</button>
    <button class="btn so-edita" id="bColuna" title="Nova coluna">+ Coluna</button>
    <button class="btn so-edita" id="bDesfaz" title="Desfazer (Ctrl+Z)" disabled>↶ Desfazer</button>
    <button class="btn so-edita" id="bImporta" title="Trazer guias de um arquivo do Excel">Importar Excel</button>
    <button class="btn" id="bExporta" title="Baixar como arquivo do Excel">Exportar Excel</button>
    <button class="btn" id="bAjuda" title="Fórmulas e atalhos">?</button>
  </div>
</div>
<div class="fx" id="fxBar"><span class="end" id="fxEnd">—</span><b>fx</b><input id="fxIn" spellcheck="false" placeholder="Escolha uma célula. Fórmulas começam com =, ex.: =PROCV(A2;Estoque!A:C;2;0)"><span class="dica" id="fxDica"></span></div>
<main class="area" id="area"><div class="vis" id="vis"></div><div class="cursores" id="cursores"></div></main>
<nav class="guias" id="guias" aria-label="Guias"></nav>
<input type="file" id="arq" accept=".xlsx,.xls,.csv" class="hidden">
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="aviso" id="aviso"><div><div class="carrega" id="avisoGira"></div><h1 id="avisoT">Abrindo a planilha…</h1><p id="avisoP"></p><a class="btn hidden" id="avisoL" href="index.html">Ir para o Crediffato Gestão</a></div></div>

<script>
// ===== Fórmulas das Planilhas (estilo Excel em português) =====
// Referências: A1 (coluna A = 1ª coluna, linha 1 = 1ª linha de dados), intervalos A1:C10, colunas inteiras A:C,
// outra guia: Estoque!A:C ou 'Guia com espaço'!B2. Separador de argumentos ";" (vírgula também vale fora de número).
// Funções: SOMA, MÉDIA, MÍNIMO, MÁXIMO, CONT.VALORES, CONT.NÚM, CONT.SE, SOMASE, MÉDIASE, SE, E, OU, NÃO, SEERRO,
// PROCV, PROCX, ÍNDICE, CORRESP, ARRED, ABS, HOJE, DIAS, DATA, ANO, MÊS, DIA, CONCATENAR, MAIÚSCULA, MINÚSCULA, ARRUMAR, ÉCÉL.VAZIA
// (nomes em inglês também: SUM, IF, VLOOKUP…).
(function(root){
  class Erro { constructor(c){ this.c = c; } toString(){ return this.c; } }
  const E = c => new Erro(c), ehErro = v => v instanceof Erro;
  const semAc = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const colNum = l => { let n = 0; for(const ch of l.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const colLetra = i => { let s = ''; i++; while(i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  // datas: 'AAAA-MM-DD' ↔ número de série (dias desde 30/12/1899, como o Excel)
  const BASE = Date.UTC(1899, 11, 30);
  const dataSerie = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s)); return m ? Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - BASE) / 864e5) : null; };

  const ehAdmin = eu.role === 'admin', doSetor = eu.areas.includes(meta.setor);
  const c = (meta.compart || []).filter(x => (x.tipo === 'pessoa' && String(x.id).toLowerCase() === String(eu.email).toLowerCase()) || (x.tipo === 'setor' && eu.areas.includes(x.id)));
  if(!ehAdmin && !doSetor && !c.length && String(meta.criadoPor || '').toLowerCase() !== String(eu.email).toLowerCase()){ aviso('Sem acesso a esta planilha', 'Ela é do setor ' + setorNome + '. Peça para alguém de lá compartilhar com você.', true); return; }
  nivel = ehAdmin || doSetor || String(meta.criadoPor || '').toLowerCase() === String(eu.email).toLowerCase() || c.some(x => x.nivel === 'editar') ? 'editar' : 'ver';
  document.body.classList.toggle('soler', nivel !== 'editar');
  $('#soLer').classList.toggle('hidden', nivel === 'editar');
  document.querySelectorAll('.so-edita').forEach(b => b.classList.toggle('hidden', nivel !== 'editar'));
  $('#nome').readOnly = nivel !== 'editar';
  $('#pasta').textContent = 'Pasta ' + setorNome + (doSetor || ehAdmin ? '' : ' · compartilhada com você');
  if(document.activeElement !== $('#nome')) $('#nome').value = meta.nome;
  document.title = meta.nome + ' · Planilhas';
  if(ouvindo) return; ouvindo = true;
  onSnapshot(REF, {includeMetadataChanges:true}, s => {
    if(!s.exists()){ aviso('Planilha vazia', 'Os dados desta planilha não foram encontrados.', true); return; }
    live(s.metadata.hasPendingWrites ? 'salvando' : 'ok');
    if(s.metadata.hasPendingWrites && S && !primeira) return;   // eco da minha própria mudança: a tela já está certa
    const antes = S; S = s.data(); S.guias = S.guias || {}; S.dados = S.dados || {};
    if(!g || !S.guias[g]) g = guiasOrd()[0] && guiasOrd()[0].id;
    $('#aviso').classList.add('hidden');

    primeira = false;
  }, () => { live('off'); });
  onSnapshot(PRES, s => { pres = (s.exists() && s.data().u) || {}; pintaPres(); });
  presenca(); setInterval(presenca, 20000);
  addEventListener('pagehide', () => { setDoc(PRES, {u:{[eu.uid]:deleteField()}}, {merge:true}).catch(() => {}); });

}

// ---------- modelo ----------
const guiasOrd = () => Object.entries(S.guias).map(([id, x]) => ({id, ...x})).sort((a, b) => (a.pos || 0) - (b.pos || 0));
const G = () => S.guias[g];
const cols = () => G().cols || [];
const ordem = () => G().ordem || [];
const cel = (gid, rid, cid) => ((S.dados[gid] || {})[rid] || {})[cid];
const colDe = (gid, i) => (S.guias[gid].cols || [])[i];
const tipoDe = c => (c && c.tipo) || 'texto';
// coluna de prazo: data cujo nome fala de prazo/vencimento (só ela fica vermelha quando passa do dia)
const ehPrazo = c => tipoDe(c) === 'data' && /prazo|venc|entrega|limite|até/i.test(c.nome || '');
const colData = () => cols().find(ehPrazo) || cols().find(c => tipoDe(c) === 'data');

// "fórmula da coluna": vale para toda linha que tem algum dado e não tem valor próprio naquela célula
// (# vira o número da linha). Assim linha nova já sai calculada, sem copiar fórmula.
function bruto(gid, rid, c){
  const v = cel(gid, rid, c.id); if(v !== undefined && v !== '' || !c.formula) return v;
  const gu = S.guias[gid], li = (gu.ordem || []).indexOf(rid);
  const temDado = (gu.cols || []).some(x => !x.formula && cel(gid, rid, x.id) !== undefined && cel(gid, rid, x.id) !== '');
  return temDado ? String(c.formula).replace(/#/g, li + 1) : v;
}
// valores calculados (fórmulas) — memória por pintura, com proteção contra ciclo
let memo = new Map(), pilha = new Set();
function valor(gid, li, ci){
  const gu = S.guias[gid]; if(!gu) return new F.Erro('#REF!');
  const rid = (gu.ordem || [])[li], c = (gu.cols || [])[ci]; if(!rid || !c) return '';
  const v = bruto(gid, rid, c); if(typeof v !== 'string' || v[0] !== '=') return v ?? '';
  const k = gid + '|' + li + '|' + ci; if(memo.has(k)) return memo.get(k);
  if(pilha.has(k)) return new F.Erro('#CICLO!');
  pilha.add(k); const r = F.avalia(v, ctxF, gid); pilha.delete(k); memo.set(k, r); return r;
}
const ctxF = {guia: n => { const lst = guiasOrd(); const x = lst.find(q => q.id === n) || lst.find(q => String(q.nome).trim().toLowerCase() === String(n).trim().toLowerCase()); if(!x) return null;
  return {cols:(x.cols || []).length, linhas:(x.ordem || []).length, valor:(l, c) => valor(x.id, l, c)}; }};

// ---------- formatos ----------
const nfmt = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:6}), mfmt = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const dataBR = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s)); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(s); };
const hojeISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const pessoa = email => DIR.find(x => String(x.email).toLowerCase() === String(email).toLowerCase());
const nomeP = email => { const p = pessoa(email); return p ? (p.name || p.email) : String(email); };
const statusOp = (c, v) => (c.opcoes || []).find(o => String(o.v).toLowerCase() === String(v).toLowerCase());
function mostra(c, v, ehF){
  if(F.ehErro(v)) return {h:esc(String(v)), cls:'err'};
  const t = tipoDe(c);
  if(v === '' || v == null) return {h:'', cls:''};
  if(t === 'numero'){ const n = F.num(v); return F.ehErro(n) ? {h:esc(v), cls:''} : {h:nfmt.format(n), cls:'num'}; }
  if(t === 'moeda'){ const n = F.num(v); return F.ehErro(n) ? {h:esc(v), cls:''} : {h:mfmt.format(n), cls:'num'}; }
  if(t === 'data'){ const s = typeof v === 'number' ? F.serieData(v) : String(v); const venc = s < hojeISO() && c.alertaVencido !== false; return {h:esc(dataBR(s)), cls:venc && !ehF ? '' : ''}; }
  if(t === 'status'){ const o = statusOp(c, v); const cor = o ? o.c : '#7f7f88'; return {h:`<span class="pill" style="color:${cor};background:${cor}22">${esc(o ? o.v : v)}</span>`, cls:''}; }
  if(t === 'pessoa'){ const n = nomeP(v); return {h:`<span class="pes"><b style="background:${corDe(v)}">${esc(iniciais(n))}</b>${esc(n)}</span>`, cls:''}; }
  if(t === 'caixa'){ const on = v === true || /^(true|sim|verdadeiro|1|x)$/i.test(String(v)); return {h:`<span class="chk${on ? ' on' : ''}"></span>`, cls:''}; }
  if(t === 'link'){ const u = String(v); const ok = /^https?:\/\//i.test(u); return {h:ok ? `<a class="lk" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, ''))}</a>` : esc(u), cls:''}; }
  if(typeof v === 'number') return {h:nfmt.format(v), cls:'num'};
  if(typeof v === 'boolean') return {h:v ? 'VERDADEIRO' : 'FALSO', cls:''};
  return {h:esc(v), cls:''};
}

// ---------- gravação ----------
let tMeta = 0;
async function grava(pares, {semDesfazer = false, rotulo = ''} = {}){
  if(nivel !== 'editar' || !pares.length) return;
  if(!semDesfazer){ desfazer.push(pares.map(([p]) => [p, pega(p)])); if(desfazer.length > 100) desfazer.shift(); $('#bDesfaz').disabled = false; }
  pares.forEach(([p, v]) => poe(p, v));     // tela muda na hora; o Firestore confirma em seguida
  live('salvando');
  try{
    for(let i = 0; i < pares.length; i += 200){
      const args = []; pares.slice(i, i + 200).forEach(([p, v]) => { args.push(new FieldPath(...p), v === undefined || v === '' || v === null ? deleteField() : v); });
      await updateDoc(REF, ...args);
    }
    if(Date.now() - tMeta > 30000){ tMeta = Date.now(); updateDoc(IDX, new FieldPath('itens', ID, 'atualizadoEm'), new Date().toISOString(), new FieldPath('itens', ID, 'atualizadoPor'), eu.nome).catch(() => {}); }
  }catch(e){ toast('Não salvou: ' + (e.message || e)); live('off'); }
}
const pega = p => p.reduce((o, k) => o == null ? undefined : o[k], S);
const poe = (p, v) => { let o = S; for(let i = 0; i < p.length - 1; i++){ o[p[i]] = o[p[i]] || {}; o = o[p[i]]; } if(v === undefined || v === '' || v === null) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = v; };
const tamanho = () => JSON.stringify(S).length;
function cabe(){ if(tamanho() > 900000){ toast('Esta planilha está perto do limite de tamanho. Para crescer mais, divida em outra planilha.'); return false; } return true; }

// conversão do que a pessoa digitou para o tipo da coluna
function converte(c, s){
  s = String(s); if(s === '') return '';
  if(s[0] === '=') return s;
  const t = tipoDe(c);
  if(t === 'numero' || t === 'moeda'){ const n = F.num(s.replace(/^R\$\s*/, '')); return F.ehErro(n) ? s : n; }
  if(t === 'data'){ const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(s.trim()); if(m){ const a = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : String(new Date().getFullYear()); return `${a}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; } return s; }
  if(t === 'caixa') return /^(true|sim|verdadeiro|1|x)$/i.test(s.trim());
  if(t === 'pessoa'){ const p = DIR.find(x => (x.name || '').toLowerCase() === s.trim().toLowerCase() || String(x.email).toLowerCase() === s.trim().toLowerCase()); return p ? p.email : s; }
  return s;
}

// ---------- pintura ----------
function pinta(antes){
  memo = new Map();
  pintaGuias();
  if(vis === 'grade') pintaGrade(antes); else if(vis === 'quadro') pintaQuadro(); else if(vis === 'cal') pintaCal(); else pintaResumo();
  pintaFx(); pintaPres();
}
function linhasVisiveis(){
  const o = ordem(); if(!busca) return o.map((rid, i) => ({rid, i}));
  const q = busca.toLowerCase();
  return o.map((rid, i) => ({rid, i})).filter(({i}) => cols().some((c, ci) => { const v = valor(g, i, ci); return String(c.tipo === 'pessoa' ? nomeP(v) : v).toLowerCase().includes(q); }));
}
function pintaGrade(antes){
  const box = $('#vis'), cs = cols(), lst = linhasVisiveis();
  const largs = cs.map(c => c.larg || (tipoDe(c) === 'texto' ? 220 : tipoDe(c) === 'caixa' ? 90 : 150));
  const novas = antes && antes.guias && antes.guias[g] ? new Set(ordem().filter(r => !(antes.guias[g].ordem || []).includes(r))) : new Set();
  const mudou = (rid, cid) => antes && antes.dados && antes.dados[g] && JSON.stringify(((antes.dados[g] || {})[rid] || {})[cid]) !== JSON.stringify(cel(g, rid, cid)) && !novas.has(rid);
  const sx = box.scrollLeft, sy = box.scrollTop;

    <thead><tr><th class="rn"></th>${cs.map((c, ci) => `<th class="${ci === 0 ? 'c0' : ''}" data-col="${ci}" title="${esc(TIPOS.find(t => t[0] === tipoDe(c))[1])} · clique para opções"><span class="l">${F.colLetra(ci)}</span>${esc(c.nome)}<span class="ti">${c.formula ? 'fx' : esc(TIPOS.find(t => t[0] === tipoDe(c))[2])}</span></th>`).join('')}</tr></thead>
    <tbody>${lst.map(({rid, i}) => `<tr data-r="${i}"${novas.has(rid) ? ' class="nova"' : ''}><td class="rn" data-rn="${i}">${i + 1}</td>${cs.map((c, ci) => { const raw = bruto(g, rid, c), ehF = typeof raw === 'string' && raw[0] === '='; const m = mostra(c, valor(g, i, ci), ehF);
      const venc = ehPrazo(c) && raw && String(ehF ? '' : raw) < hojeISO() && linhaAberta(rid);
      return `<td data-r="${i}" data-c="${ci}" class="${ci === 0 ? 'c0 ' : ''}${m.cls}${ehF && raw === cel(g, rid, c.id) ? ' fm' : ''}${venc ? ' late' : ''}${mudou(rid, c.id) ? ' brilha' : ''}">${m.h}</td>`; }).join('')}</tr>`).join('')}
    ${nivel === 'editar' && !busca ? `<tr class="addl"><td class="rn">+</td><td colspan="${cs.length}" id="addLinha">Nova linha</td></tr>` : ''}</tbody></table>
    ${!cs.length ? '<div class="vazio">Esta guia não tem colunas. Clique em <b>+ Coluna</b>.</div>' : ''}`;
  box.scrollLeft = sx; box.scrollTop = sy;
  marcaSel();
}
// linha "aberta" = status que não é de concluído (para pintar prazo vencido só no que falta fazer)
function linhaAberta(rid){ const c = cols().find(x => tipoDe(x) === 'status'); if(!c) return true; const v = String(cel(g, rid, c.id) || ''); return !/conclu|resolvid|respondid|feito|entregue|finaliz|cancel|ok$/i.test(v); }
function marcaSel(){
  document.querySelectorAll('#gT td.cur, #gT td.ins').forEach(x => x.classList.remove('cur', 'ins'));
  const a = ancora || sel, r0 = Math.min(a.r, sel.r), r1 = Math.max(a.r, sel.r), c0 = Math.min(a.c, sel.c), c1 = Math.max(a.c, sel.c);
  if(r0 !== r1 || c0 !== c1) document.querySelectorAll('#gT td[data-c]').forEach(td => { const r = +td.dataset.r, c = +td.dataset.c; if(r >= r0 && r <= r1 && c >= c0 && c <= c1) td.classList.add('ins'); });
  const td = celTd(sel.r, sel.c); if(td){ td.classList.add('cur'); }
  pintaFx();
}
const celTd = (r, c) => document.querySelector(`#gT td[data-r="${r}"][data-c="${c}"]`);
function pintaFx(){
  if(!S || !G() || vis !== 'grade'){ $('#fxEnd').textContent = '—'; return; }
  const c = cols()[sel.c], rid = ordem()[sel.r];
  $('#fxEnd').textContent = c && rid ? F.colLetra(sel.c) + (sel.r + 1) : '—';
  if(document.activeElement !== $('#fxIn')){ const v = c && rid ? bruto(g, rid, c) : ''; $('#fxIn').value = v === undefined ? '' : (tipoDe(c) === 'data' && v && v[0] !== '=' ? dataBR(v) : tipoDe(c) === 'pessoa' && v ? nomeP(v) : String(v)); }
  $('#fxIn').readOnly = nivel !== 'editar';
  const a = ancora || sel; const n = (Math.abs(a.r - sel.r) + 1) * (Math.abs(a.c - sel.c) + 1);
  if(n > 1){ const vals = []; for(let r = Math.min(a.r, sel.r); r <= Math.max(a.r, sel.r); r++) for(let c2 = Math.min(a.c, sel.c); c2 <= Math.max(a.c, sel.c); c2++){ const v = F.num(valor(g, r, c2)); if(!F.ehErro(v) && valor(g, r, c2) !== '') vals.push(v); }
    $('#fxDica').textContent = vals.length ? `Soma ${nfmt.format(vals.reduce((x, y) => x + y, 0))} · Média ${nfmt.format(vals.reduce((x, y) => x + y, 0) / vals.length)} · ${n} células` : n + ' células'; }
  else $('#fxDica').textContent = '';
}
function pintaGuias(){
  const box = $('#guias'), lst = guiasOrd();
  box.innerHTML = lst.map(x => `<button class="gu${x.id === g ? ' on' : ''}" data-g="${x.id}" title="Clique duas vezes para renomear">${esc(x.nome)}</button>`).join('') +
    (nivel === 'editar' ? '<button class="gu" id="novaGuia" title="Nova guia">+</button>' : '') + `<span class="soma">${ordem().length} linhas · ${cols().length} colunas</span>`;
}

// ---------- quadro ----------
function pintaQuadro(){
  const box = $('#vis'), cs = cols(), cSt = cs.find(c => tipoDe(c) === 'status');
  if(!cSt){ box.innerHTML = `<div class="vazio entra">O quadro organiza as linhas por <b>Status</b>.<br>Crie uma coluna do tipo Status (+ Coluna) para usar esta visão.</div>`; return; }
  const txts = cs.filter(c => tipoDe(c) === 'texto'), cTit = txts[0] || cs[0], cSub = txts.find(c => !/protocolo|c[óo]digo|id$/i.test(c.nome) && c !== cTit) || txts[1], cPes = cs.find(c => tipoDe(c) === 'pessoa'), cDt = colData();

  const cheias = linhasVisiveis().filter(({rid}) => cols().some(c => !c.formula && cel(g, rid, c.id) !== undefined && cel(g, rid, c.id) !== ''));
  const grupos = ops.map(o => ({o, l:cheias.filter(({rid}) => { const v = String(cel(g, rid, cSt.id) ?? ''); return o.v === '' ? !v || !statusOp(cSt, v) : v.toLowerCase() === String(o.v).toLowerCase(); })}));
  box.innerHTML = `<div class="kan entra">${grupos.filter(x => x.o.v !== '' || x.l.length).map(({o, l}) => `<div class="col" data-st="${esc(o.v)}"><h5><span class="pill" style="color:${o.c};background:${o.c}22">${esc(o.nome || o.v)}</span><em>${l.length}</em></h5>

      const sub = cSub ? valor(g, i, cs.indexOf(cSub)) : '';
      return `<div class="kc" draggable="${nivel === 'editar'}" data-rid="${rid}" style="animation-delay:${Math.min(i, 12) * 0.02}s"><b>${esc(F.ehErro(t) ? t : t || '(sem título)')}</b>${sub && !F.ehErro(sub) ? `<span style="color:var(--t2)">${esc(sub)}</span>` : ''}
        <small><span>${cPes && cel(g, rid, cPes.id) ? mostra(cPes, cel(g, rid, cPes.id)).h : ''}</span><span class="${dt && ehPrazo(cDt) && dt < hojeISO() && o.v !== '' && linhaAberta(rid) ? 'late' : ''}">${dt && typeof dt === 'string' && dt[0] !== '=' ? dataBR(dt) : ''}</span></small></div>`; }).join('')}</div>`).join('')}</div>`;
  if(nivel !== 'editar') return;
  let arr = null;
  box.querySelectorAll('.kc').forEach(k => { k.addEventListener('dragstart', e => { arr = k.dataset.rid; k.classList.add('arrasta'); e.dataTransfer.effectAllowed = 'move'; }); k.addEventListener('dragend', () => k.classList.remove('arrasta')); });
  box.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('sobre'); });
    col.addEventListener('dragleave', () => col.classList.remove('sobre'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('sobre'); if(!arr) return; grava([[['dados', g, arr, cSt.id], col.dataset.st || '']]); pinta(); });
  });
}
// ---------- calendário ----------

  const txts = cs.filter(c => tipoDe(c) === 'texto'), cTit = txts[0] || cs[0], cSub = txts.find(c => !/protocolo|c[óo]digo|id$/i.test(c.nome) && c !== cTit), cSt = cs.find(c => tipoDe(c) === 'status');
  if(!mesAtual){ const d = new Date(); mesAtual = new Date(d.getFullYear(), d.getMonth(), 1); }
  const ini = new Date(mesAtual); ini.setDate(1 - ini.getDay()); const hoje = hojeISO();
  const porDia = {}; linhasVisiveis().forEach(({rid, i}) => { let v = valor(g, i, cs.indexOf(cDt)); if(typeof v === 'number') v = F.serieData(v); if(/^\d{4}-\d{2}-\d{2}$/.test(String(v))) (porDia[v] = porDia[v] || []).push({rid, i}); });
  const dias = []; for(let k = 0; k < 42; k++){ const d = new Date(ini); d.setDate(ini.getDate() + k); dias.push(d); }
  const iso = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  box.innerHTML = `<div class="cal entra"><div class="calhead"><button class="btn" id="mesAnt">‹</button><b>${(m => m[0].toUpperCase() + m.slice(1))(mesAtual.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}))}</b><button class="btn" id="mesProx">›</button><button class="btn" id="mesHoje">Hoje</button></div>
    <div class="calg">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="dn">${d}</div>`).join('')}
    ${dias.map(d => { const k = iso(d), l = porDia[k] || []; return `<div class="dia${d.getMonth() !== mesAtual.getMonth() ? ' fora' : ''}${k === hoje ? ' hoje' : ''}"><span class="n">${d.getDate()}</span>${l.slice(0, 4).map(({rid, i}) => { const o = cSt ? statusOp(cSt, cel(g, rid, cSt.id)) : null; const t0 = cTit ? valor(g, i, cs.indexOf(cTit)) : '', sb = cSub ? valor(g, i, cs.indexOf(cSub)) : '', t = [t0, sb].filter(x => x !== '' && !F.ehErro(x)).join(' · ');
      return `<span class="ev" style="--c:${o ? o.c : 'var(--t3)'}" title="${esc(t)}">${esc(F.ehErro(t) ? t : t || '—')}</span>`; }).join('')}${l.length > 4 ? `<span class="n">+${l.length - 4}</span>` : ''}</div>`; }).join('')}</div></div>`;
  $('#mesAnt').onclick = () => { mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth() - 1, 1); pintaCal(); };
  $('#mesProx').onclick = () => { mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 1); pintaCal(); };
  $('#mesHoje').onclick = () => { mesAtual = null; pintaCal(); };
}
// ---------- resumo ----------
function pintaResumo(){
  const box = $('#vis'), cs = cols(), lst = linhasVisiveis().filter(({rid}) => cs.some(c => cel(g, rid, c.id) !== undefined && cel(g, rid, c.id) !== ''));
  const cards = [`<div class="rc"><h4>Linhas preenchidas</h4><div class="big">${lst.length}</div></div>`];
  cs.forEach((c, ci) => {
    const t = tipoDe(c);
    if(t === 'status' || t === 'pessoa'){ const cont = {}; lst.forEach(({i}) => { const v = valor(g, i, ci); const k = t === 'pessoa' ? (v ? nomeP(v) : '(ninguém)') : (v || '(sem status)'); cont[k] = (cont[k] || 0) + 1; });
      const max = Math.max(1, ...Object.values(cont));
      cards.push(`<div class="rc"><h4>${esc(c.nome)}</h4>${Object.entries(cont).sort((a, b) => b[1] - a[1]).map(([k, n], j) => { const o = t === 'status' ? statusOp(c, k) : null; const cor = o ? o.c : t === 'pessoa' ? corDe(k) : '#7f7f88';
        return `<div class="barr"><span>${esc(k)}</span><i><span style="width:${n / max * 100}%;background:${cor};animation-delay:${j * 0.05}s"></span></i><em>${n}</em></div>`; }).join('')}</div>`); }
    if(t === 'numero' || t === 'moeda'){ const vs = lst.map(({i}) => F.num(valor(g, i, ci))).filter(v => !F.ehErro(v)); const soma = vs.reduce((a, b) => a + b, 0); const f = t === 'moeda' ? mfmt : nfmt;
      cards.push(`<div class="rc"><h4>${esc(c.nome)}</h4><div class="big">${f.format(soma)}</div><span class="ajuda">soma · média ${f.format(vs.length ? soma / vs.length : 0)} · ${vs.length} valores</span></div>`); }
    if(t === 'caixa'){ const on = lst.filter(({i}) => { const v = valor(g, i, ci); return v === true || /^(true|sim|1|x)$/i.test(String(v)); }).length;
      cards.push(`<div class="rc"><h4>${esc(c.nome)}</h4><div class="big">${on}<span class="ajuda"> de ${lst.length}</span></div><div class="barr" style="grid-template-columns:1fr 40px"><i><span style="width:${lst.length ? on / lst.length * 100 : 0}%;background:var(--ok)"></span></i><em>${lst.length ? Math.round(on / lst.length * 100) : 0}%</em></div></div>`); }

}

// ---------- presença e cursores ----------

}
const outros = () => Object.entries(pres).filter(([uid, p]) => uid !== (eu && eu.uid) && p && Date.now() - (p.t || 0) < 60000);

  const vivos = new Set();

    if(p.g !== g || vis !== 'grade') return;
    const alvo = String(p.h || '').split(':'), rid = alvo[0] || p.r, cid = alvo[1] || p.c;
    const ri = ordem().indexOf(rid), ci = cols().findIndex(c => c.id === cid);
    const tdSel = celTd(ordem().indexOf(p.r), cols().findIndex(c => c.id === p.c)); if(tdSel){ tdSel.style.setProperty('--cor', p.cor); tdSel.classList.add('outro'); }
    const td = celTd(ri, ci); if(!td) return;

    if(!e){ e = document.createElement('div'); e.className = 'curs'; e.dataset.u = uid; e.innerHTML = `<svg width="16" height="20" viewBox="0 0 16 20"><path d="M1 1l13 8.5-6 1.2-3.2 6.3z" fill="${p.cor}" stroke="#0b0b0d" stroke-width="1.4" stroke-linejoin="round"/></svg><span style="background:${p.cor}">${esc(String(p.n).split(' ')[0])}</span>`; e.style.opacity = 0; camada.appendChild(e);
      e.style.transform = `translate(${r.left - area.left + 20}px,${r.top - area.top + 10}px)`; requestAnimationFrame(() => { e.style.opacity = 1; }); }
    e.style.transform = `translate(${r.left - area.left + Math.min(40, r.width * .35)}px,${r.top - area.top + r.height * .5}px)`;

  else if(!ehF && inicial === undefined && t === 'pessoa'){ ed = document.createElement('select'); ed.innerHTML = '<option value="">—</option>' + DIR.slice().sort((a, b) => String(a.name || a.email).localeCompare(String(b.name || b.email))).map(p => `<option value="${esc(p.email)}"${p.email === atual ? ' selected' : ''}>${esc(p.name || p.email)}</option>`).join(''); }

  else { ed = document.createElement('input'); ed.value = inicial !== undefined ? inicial : (atual === undefined ? '' : t === 'data' && !ehF ? dataBR(atual) : t === 'pessoa' && !ehF ? nomeP(atual) : String(atual)); ed.spellcheck = false; }

// ---------- copiar / colar (Excel) ----------
function intervalo(){ const a = ancora || sel; return {r0:Math.min(a.r, sel.r), r1:Math.max(a.r, sel.r), c0:Math.min(a.c, sel.c), c1:Math.max(a.c, sel.c)}; }

  const {r0, r1, c0, c1} = intervalo(), out = [];
  for(let r = r0; r <= r1; r++){ const l = []; for(let c = c0; c <= c1; c++){ const v = valor(g, r, c); l.push(F.ehErro(v) ? String(v) : tipoDe(cols()[c]) === 'pessoa' ? nomeP(v) : tipoDe(cols()[c]) === 'data' && v ? dataBR(v) : typeof v === 'number' ? String(v).replace('.', ',') : String(v ?? '')); } out.push(l.join('\t')); }
  e.clipboardData.setData('text/plain', out.join('\n')); e.preventDefault(); toast('Copiado: ' + ((r1 - r0 + 1) * (c1 - c0 + 1)) + ' célula(s)');
});
document.addEventListener('paste', e => {

  grava(pares); pinta(); toast(`Colado: ${linhas.length} linha(s)${novasLinhas ? ' · ' + novasLinhas + ' nova(s)' : ''}`);
});

document.addEventListener('keydown', e => {

  const foco = document.activeElement; if(foco && (foco.tagName === 'INPUT' || foco.tagName === 'SELECT' || foco.tagName === 'TEXTAREA')) return;
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;

  if(ctrl && (k === 'f' || k === 'F')){ e.preventDefault(); $('#busca').focus(); return; }
  if(k === 'ArrowDown'){ e.preventDefault(); move(1, 0, e.shiftKey); } else if(k === 'ArrowUp'){ e.preventDefault(); move(-1, 0, e.shiftKey); }
  else if(k === 'ArrowRight'){ e.preventDefault(); move(0, 1, e.shiftKey); } else if(k === 'ArrowLeft'){ e.preventDefault(); move(0, -1, e.shiftKey); }

function ordena(ci, dir){

  o.sort((a, b) => { const x = val(a), y = val(b); if(x === null) return 1; if(y === null) return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', {numeric:true})) * dir; });

  f.querySelector('[data-ok]').onclick = () => {
    c.nome = f.querySelector('#cNome').value.trim() || 'Coluna'; c.tipo = f.querySelector('#cTipo').value;
    const fo = f.querySelector('#cForm').value.trim(); if(fo) c.formula = fo[0] === '=' ? fo : '=' + fo; else delete c.formula;
    if(c.tipo === 'status') c.opcoes = ops.filter(o => String(o.v).trim()).map(o => ({v:String(o.v).trim(), c:o.c})); else delete c.opcoes;
    const cs = cols().map(x => ({...x})); if(ci === null) cs.splice(inserirEm === undefined ? cs.length : inserirEm, 0, c); else cs[ci] = c;
    grava([[['guias', g, 'cols'], cs]]); fecha(f); pinta(); };
}
$('#guias').addEventListener('click', e => {
  const b = e.target.closest('[data-g]'); if(b){ if(b.dataset.g === g) return; fechaEditor(); g = b.dataset.g; sel = {r:0, c:0}; ancora = null; trocaVis(vis); presenca(); return; }
  if(e.target.id === 'novaGuia'){ if(!cabe()) return; const id = novoId(), n = guiasOrd().length + 1;
    const cs = [{id:novoId(), nome:'Coluna A', tipo:'texto'}, {id:novoId(), nome:'Coluna B', tipo:'texto'}, {id:novoId(), nome:'Coluna C', tipo:'texto'}];
    grava([[['guias', id], {nome:'Guia ' + n, pos:Math.max(0, ...guiasOrd().map(x => x.pos || 0)) + 1, cols:cs, ordem:Array.from({length:10}, novoId)}]]); g = id; sel = {r:0, c:0}; pinta(); }
});
$('#guias').addEventListener('dblclick', e => { const b = e.target.closest('[data-g]'); if(!b || nivel !== 'editar') return; renomeiaGuia(b.dataset.g, b); });
$('#guias').addEventListener('contextmenu', e => { const b = e.target.closest('[data-g]'); if(!b || nivel !== 'editar') return; e.preventDefault();
  menu([['Renomear', () => renomeiaGuia(b.dataset.g, b)], ['Excluir guia', () => { if(guiasOrd().length < 2){ toast('A planilha precisa de pelo menos uma guia'); return; }
    confirmaExclusao('a guia "' + S.guias[b.dataset.g].nome + '"', () => { const id = b.dataset.g; grava([[['guias', id], ''], [['dados', id], '']], {semDesfazer:true}); g = guiasOrd().find(x => x.id !== id).id; pinta(); }); }, 'perigo']], b); });
function renomeiaGuia(id, b){ const inp = document.createElement('input'); inp.value = S.guias[id].nome; b.textContent = ''; b.appendChild(inp); inp.focus(); inp.select();
  const ok = () => { const v = inp.value.trim(); if(v && v !== S.guias[id].nome){ if(guiasOrd().some(x => x.id !== id && x.nome.toLowerCase() === v.toLowerCase())){ toast('Já existe uma guia com esse nome'); } else grava([[['guias', id, 'nome'], v]]); } pinta(); };
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') inp.blur(); if(e.key === 'Escape'){ inp.value = S.guias[id].nome; inp.blur(); } }); inp.addEventListener('blur', ok, {once:true}); }
$('#nome').addEventListener('change', () => { const v = $('#nome').value.trim(); if(!v || nivel !== 'editar'){ $('#nome').value = meta.nome; return; } updateDoc(IDX, new FieldPath('itens', ID, 'nome'), v).then(() => toast('Nome salvo')).catch(e => toast('Não salvou: ' + e.message)); });
$('#nome').addEventListener('keydown', e => { if(e.key === 'Enter') $('#nome').blur(); });

// ---------- visões ----------
function trocaVis(v){ vis = v; document.querySelectorAll('.vt').forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#fxBar').classList.toggle('hidden', v !== 'grade');
  const el = $('#vis'); el.classList.remove('entra'); void el.offsetWidth; if(!reduz) el.classList.add('entra'); pinta(); presenca(); }
document.querySelectorAll('.vt').forEach(b => b.onclick = () => trocaVis(b.dataset.v));
let tBusca = 0; $('#busca').addEventListener('input', e => { clearTimeout(tBusca); tBusca = setTimeout(() => { busca = e.target.value.trim(); pinta(); }, 150); });

// ---------- Excel ----------
let xlsxP = null;
const xlsx = () => xlsxP || (xlsxP = new Promise((ok, erro) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxP = null; erro(new Error('não consegui carregar o leitor de Excel (sem internet?)')); }; document.head.appendChild(s); }));
$('#bExporta').onclick = async () => {
  try{ const X = await xlsx(), wb = X.utils.book_new();
    guiasOrd().forEach(gu => { const cs = gu.cols || [], aoa = [cs.map(c => c.nome)];
      (gu.ordem || []).forEach((rid, li) => { aoa.push(cs.map((c, ci) => { const v = valor(gu.id, li, ci); if(F.ehErro(v)) return String(v); const t = tipoDe(c);
        if(t === 'data' && v){ const s = typeof v === 'number' ? F.serieData(v) : String(v); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00') : s; }
        if(t === 'pessoa') return v ? nomeP(v) : ''; if(t === 'caixa') return v === true ? 'Sim' : ''; return v; })); });
      while(aoa.length > 1 && aoa[aoa.length - 1].every(x => x === '' || x == null)) aoa.pop();
      const ws = X.utils.aoa_to_sheet(aoa, {cellDates:true}); ws['!cols'] = cs.map(c => ({wch:Math.round((c.larg || 160) / 7)}));
      X.utils.book_append_sheet(wb, ws, String(gu.nome).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31)); });
    X.writeFile(wb, (meta.nome || 'planilha').replace(/[\\/:*?"<>|]/g, '_') + '.xlsx'); toast('Excel baixado (fórmulas saem com o valor calculado)');
  }catch(e){ toast('Não exportou: ' + (e.message || e)); }
};
$('#bImporta').onclick = () => $('#arq').click();
$('#arq').onchange = async () => {
  const fl = $('#arq').files[0]; $('#arq').value = ''; if(!fl) return;
  try{ const X = await xlsx(), wb = X.read(new Uint8Array(await fl.arrayBuffer()), {type:'array', cellDates:true});
    const pares = []; let pos = Math.max(0, ...guiasOrd().map(x => x.pos || 0)), nomes = [];
    wb.SheetNames.forEach(sn => {
      const aoa = X.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:true}); if(!aoa.length) return;
      const cab = aoa[0].map((h, i) => String(h || '').trim() || 'Coluna ' + F.colLetra(i)), corpo = aoa.slice(1).filter(l => l.some(v => v !== '' && v != null));
      const cs = cab.map((n, i) => { const vs = corpo.map(l => l[i]).filter(v => v !== '' && v != null); const tipo = vs.length && vs.every(v => v instanceof Date) ? 'data' : vs.length && vs.every(v => typeof v === 'number') ? 'numero' : 'texto'; return {id:novoId(), nome:n, tipo}; });
      const gid = novoId(), ordem = [], dados = {};
      corpo.forEach(l => { const rid = novoId(); ordem.push(rid); const linha = {}; cs.forEach((c, i) => { let v = l[i]; if(v === '' || v == null) return; if(v instanceof Date) v = new Date(v - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); linha[c.id] = v; }); if(Object.keys(linha).length) dados[rid] = linha; });
      let nome = sn; while(guiasOrd().some(x => x.nome.toLowerCase() === nome.toLowerCase()) || nomes.includes(nome)) nome += ' (2)'; nomes.push(nome);
      pares.push([['guias', gid], {nome, pos:++pos, cols:cs, ordem}], [['dados', gid], dados]);
    });
    if(!pares.length){ toast('O arquivo não tem dados'); return; }
    const novoTam = tamanho() + JSON.stringify(pares).length; if(novoTam > 900000){ toast('O arquivo é grande demais para uma planilha só (limite ~900 mil caracteres). Divida em partes.'); return; }
    await grava(pares, {semDesfazer:true}); g = pares[0][0][1]; pinta(); toast('Importado: ' + nomes.join(', ') + ' (valores; fórmulas do Excel vêm com o resultado)');
  }catch(e){ toast('Não importou: ' + (e.message || e)); }
};

// ---------- ajuda ----------
$('#bAjuda').onclick = () => janela(`<h3>Fórmulas e atalhos</h3>
  <div class="ajuda"><b>Fórmulas</b> começam com <code>=</code>, separadas por <code>;</code>. Colunas são letras (A, B, C…) e linhas são os números da esquerda.<br>
  Exemplos: <code>=SOMA(C1:C20)</code> · <code>=SE(C2&lt;D2;"Repor";"OK")</code> · <code>=CONT.SE(B:B;"Concluído")</code><br>
  <b>PROCV entre guias:</b> <code>=PROCV(A2;Estoque!A:D;3;0)</code> procura o valor de A2 na 1ª coluna da guia Estoque e traz a 3ª coluna. Guia com espaço no nome: <code>'Minha guia'!A:D</code>.<br>
  <code>=SEERRO(PROCV(...);"não achei")</code> mostra um texto quando não encontra.<br><br>
  Funções: ${F.LISTA.join(', ')}.<br><br>
  <b>Atalhos:</b> setas andam · Enter ou F2 edita · digitar começa a editar · Shift+setas seleciona várias · Delete limpa · Ctrl+C / Ctrl+V copia e cola (inclusive do Excel) · Ctrl+Z desfaz · Ctrl+F busca.<br>
  Clique no cabeçalho de uma coluna para ordenar, mudar o tipo ou excluir. Clique no número da linha para inserir ou excluir. Clique duas vezes numa guia para renomear.</div>
  <div class="acoes"><button class="btn pri" data-x>Entendi</button></div>`);
</script>
</body>

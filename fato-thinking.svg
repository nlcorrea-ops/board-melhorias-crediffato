<style>
  .char{transform-box:view-box;transform-origin:140px 280px}
  .head{transform-box:view-box;transform-origin:140px 190px}
  
  .head{animation:ponder 5s ease-in-out infinite}
  .dot{transform-box:fill-box;transform-origin:center;animation:dot 1.5s ease-in-out infinite}
  .d2{animation-delay:.2s}.d3{animation-delay:.4s}
  .bub{transform-box:view-box;transform-origin:240px 40px;animation:bub 5s ease-in-out infinite}
  @keyframes ponder{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
  @keyframes bub{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
